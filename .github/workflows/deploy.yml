name: Deploy Spring Boot to Azure App Service

on:
  push:
    branches:
      - main  # Triggers the automation workflow every time code hits the main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Check out the repository source code onto the GitHub runner machine
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Set up Java 21 execution hardware on the cloud runner
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    # Step 3: Execute Maven production compilation and package the JAR artifact
    - name: Build with Maven
      run: mvn clean package -DskipTests

    # Step 4: Securely deploy the compiled binary straight into your Azure Web App slot
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'expense-api-animesh' # Matches your exact unique Azure Web App slot name
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: 'target/*.jar'
