server.port=${PORT:80}
spring.main.web-application-type=servlet

# Robust production datasource URL targeting PostgreSQL with forced SSL requirements
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:postgres}?sslmode=require&ssl=true

spring.datasource.username=${DB_USER:meshu}
spring.datasource.password=${DB_PASS:@Meshu123}

# Explicitly force the Hibernate Dialect so it doesn't crash if metadata connection lags
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
